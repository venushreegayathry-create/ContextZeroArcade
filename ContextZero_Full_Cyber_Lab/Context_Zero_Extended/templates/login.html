<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Context Zero Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 15% 10%,#282052,transparent 40%),radial-gradient(ellipse at 90% 90%,#06414a,transparent 35%),#070914;color:#eef4ff;font:15px system-ui}.box{width:min(410px,92vw);padding:30px;border:1px solid #49466b;border-radius:18px;background:linear-gradient(145deg,#14172b,#0d1421);box-shadow:0 25px 80px #0008,0 0 35px #b69cff10}.logo{background:linear-gradient(135deg,#6cf7e2,#b69cff);box-shadow:0 0 24px #6cf7e233;color:#07121d;border-radius:12px;padding:12px;width:46px;font-weight:900}h1{margin-bottom:4px}p,.muted{color:#91a2bc;font-size:13px}label{display:block;margin:15px 0 6px;font-size:12px}input{width:100%;padding:12px;border-radius:8px;border:1px solid #2b3c53;background:#0a1220;color:white}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:linear-gradient(90deg,#6cf7e2,#b69cff);font-weight:800;cursor:pointer}.err{color:#ff7185}.hint{margin-top:16px;padding:12px;border:1px solid #29394f;border-radius:8px;background:#0a1220;font-size:12px;color:#b3c2d5}</style></head><body><main class="box"><div class="logo">CZ</div><h1>Context Zero</h1><p>AI Security &amp; Cryptography Lab</p><p>Sign in to open the local demo dashboard.</p>{% if error %}<p class="err">{{error}}</p>{% endif %}<form method="post"><label>Username</label><input name="username" value="admin" required><label>Password</label><input name="password" type="password" required><button>Sign in →</button></form><div class="hint"><b>Demo credentials</b><br>Username: <code>admin</code><br>Password: <code>ContextZero2026!</code><br><br>For local classroom demo only; not production-ready.</div></main></body></html>
